name: Dependency Checks
on: [push, pull_request]

jobs:
  # Check for outdated dependencies
  check-deps:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pip-check-reqs
        
    - name: Check for missing dependencies
      run: pip-missing-reqs -f __pycache__ -f '*.pyc' src/ experiments/
      
    - name: Check for unused dependencies
      run: pip-extra-reqs -f __pycache__ -f '*.pyc' src/ experiments/

  # Security vulnerability scan
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install scanner after project deps; do not let its transitive deps
        # (e.g. vulnerable filelock pinned by safety itself) fail the project scan.
        pip install "safety>=3.2,<4"
        
    - name: Scan for security vulnerabilities
      # Scan requirements.txt only — not the whole site-packages tree (which
      # includes safety's own pinned transitive deps such as filelock<=4.2).
      run: safety check -r requirements.txt --full-report